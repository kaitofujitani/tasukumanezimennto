# PR ごと（と main への反映のたび）に、画面とサーバーのチェックを動かす
# 画面：lint（oxlint）・テスト（Vitest）・型チェックとビルド
# サーバー：静的チェック（Checkstyle・Error Prone）とテスト（Testcontainers で PostgreSQL を起動する）
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じ PR に続けて push したら、前の実行は止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（lint・テスト・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Dockerfile（node:24-alpine）とそろえる
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: サーバー（静的チェック・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          # build.gradle の toolchain・Dockerfile（eclipse-temurin:25）とそろえる
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # check：Checkstyle・コンパイル（Error Prone）・テスト。テスト用の PostgreSQL は Testcontainers が Docker で起動する
      - run: ./gradlew check
      - name: テストの結果を残す（失敗したときに見る）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/
