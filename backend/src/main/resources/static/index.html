<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理（バックエンド）</title>
  <style>
    :root { --bg: #f5f6f8; --fg: #1f2328; --sub: #59636e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d2125; --fg: #e6edf3; --sub: #9da7b3; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
    p { color: var(--sub); }
  </style>
</head>
<body>
  <main>
    <h1>バックエンドは起動しています</h1>
    <p>Spring Boot が正常に動いています。画面（React）はまだ作っていません。</p>
  </main>
</body>
</html>
