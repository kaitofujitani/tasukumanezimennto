spring.application.name=taskboard

# 待ち受けるポート。Render は環境変数 PORT で指定してくる。未設定なら 8080
server.port=${PORT:8080}

# データベース（既定値は compose.yaml の開発用 PostgreSQL。本番は環境変数で上書きする）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.username=${DB_USERNAME:taskboard}
spring.datasource.password=${DB_PASSWORD:taskboard}

# テーブルは Flyway（db/migration の SQL）で作る。JPA は定義と合っているかの確認だけ
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ログイン（docs/api.md の 5章）
# パスワードは環境変数 APP_PASSWORD で必ず渡す（既定値は置かない。未設定・空だと起動しない）
app.password=${APP_PASSWORD:}

# ログイン状態は Spring Session JDBC でデータベースに保存する。テーブルは Flyway の V2 で作る
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d

# ログイン状態の Cookie（SESSION）。Secure は付けない設定にせず、HTTPS で受けたときだけ自動で付ける
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=30d

# Render などの前段（HTTPS を受ける）からの X-Forwarded-Proto を信じ、HTTPS かどうかを正しく判断する
server.forward-headers-strategy=native
