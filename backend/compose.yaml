# 開発用の PostgreSQL（本番は Neon を使う）
# 起動: docker compose up -d   停止: docker compose down
# データは名前付きボリューム db-data に残る（消すときは docker compose down -v）
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard # 開発用。本番の値は環境変数で渡す
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
